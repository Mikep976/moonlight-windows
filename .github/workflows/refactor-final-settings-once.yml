---
name: One-time final settings extraction

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/refactor-final-settings-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'Mikep976/moonlight-windows' && github.event.pull_request.head.ref == 'agent/windows-modernization-foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract remaining settings sections
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          settings_path = Path('app/gui/SettingsView.qml')
          qrc_path = Path('app/qml.qrc')
          text = settings_path.read_text(encoding='utf-8')

          def matching_brace(source, opening):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = opening

              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''

                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1

              raise RuntimeError('Unmatched QML brace')

          def find_group(source, object_id):
              marker = f'id: {object_id}'
              marker_pos = source.find(marker)
              if marker_pos < 0:
                  raise RuntimeError(f'Could not find {marker}')

              group_pos = source.rfind('GroupBox {', 0, marker_pos)
              if group_pos < 0:
                  raise RuntimeError(f'Could not find GroupBox for {object_id}')

              line_start = source.rfind('\n', 0, group_pos) + 1
              opening = source.find('{', group_pos)
              closing = matching_brace(source, opening)
              line_end = source.find('\n', closing)
              if line_end < 0:
                  line_end = closing + 1
              else:
                  line_end += 1

              return line_start, line_end, source[line_start:line_end]

          basic_start, basic_end, basic_block = find_group(text, 'basicSettingsGroupBox')
          advanced_start, advanced_end, advanced_block = find_group(text, 'advancedSettingsGroupBox')

          # Generate the Streaming/Video component from the known-good legacy block.
          basic = textwrap.dedent(basic_block)
          if not basic.startswith('GroupBox {'):
              raise RuntimeError('Unexpected Basic settings root')
          basic = basic.replace('id: basicSettingsGroupBox', '''id: root\n\n    property var bitrateState\n    signal languageChanged()\n\n    function forceInitialFocus() {\n        resolutionComboBox.forceActiveFocus(Qt.TabFocus)\n    }''', 1)
          basic = basic.replace('bitrateController.', 'bitrateState.')
          basic = basic.replace('title: "<font color=\\"skyblue\\">" + qsTr("Basic Settings") + "</font>"', 'title: qsTr("Streaming")', 1)

          streaming_file = '''import QtQuick 2.9\nimport QtQuick.Controls 2.2\nimport QtQuick.Layouts 1.2\n\nimport StreamingPreferences 1.0\nimport SystemProperties 1.0\n\n''' + basic
          Path('app/gui/SettingsStreamingSection.qml').write_text(streaming_file, encoding='utf-8')

          # Generate Advanced/Network component and decouple parent-window polling.
          advanced = textwrap.dedent(advanced_block)
          if not advanced.startswith('GroupBox {'):
              raise RuntimeError('Unexpected Advanced settings root')
          advanced = advanced.replace('id: advancedSettingsGroupBox', '''id: root\n\n    property var bitrateState\n    signal discoverySettingsChanged()''', 1)
          advanced = advanced.replace('bitrateController.', 'bitrateState.')
          advanced = advanced.replace('title: "<font color=\\"skyblue\\">" + qsTr("Advanced Settings") + "</font>"', 'title: qsTr("Advanced")', 1)

          # Remove the parent's polling lifecycle from the extracted component structurally,
          # so this remains robust if indentation changes during dedent/extraction.
          restart_marker = '// Restart polling so the mDNS change takes effect'
          marker_pos = advanced.find(restart_marker)
          if marker_pos < 0:
              raise RuntimeError('Could not find the legacy mDNS polling restart marker')
          if_pos = advanced.find('if (window.pollingActive) {', marker_pos)
          if if_pos < 0:
              raise RuntimeError('Could not find the legacy mDNS polling restart condition')
          opening = advanced.find('{', if_pos)
          closing = matching_brace(advanced, opening)
          line_start = advanced.rfind('\n', 0, marker_pos) + 1
          line_end = advanced.find('\n', closing)
          if line_end < 0:
              line_end = closing + 1
          else:
              line_end += 1
          indent = advanced[line_start:marker_pos]
          replacement = indent + '// The parent owns polling lifecycle; request a restart.\n' + indent + 'root.discoverySettingsChanged()\n'
          advanced = advanced[:line_start] + replacement + advanced[line_end:]

          if 'window.' in advanced or 'ComputerManager.' in advanced:
              raise RuntimeError('Advanced section still reaches into parent polling/window state')

          advanced_file = '''import QtQuick 2.9\nimport QtQuick.Controls 2.2\nimport QtQuick.Layouts 1.2\n\nimport StreamingPreferences 1.0\nimport SystemProperties 1.0\n\n''' + advanced
          Path('app/gui/SettingsAdvancedSection.qml').write_text(advanced_file, encoding='utf-8')

          # Replace blocks from bottom to top so offsets remain valid.
          advanced_instance = '''        SettingsAdvancedSection {\n            id: advancedSettingsSection\n            width: parent.width - (parent.leftPadding + parent.rightPadding)\n            bitrateState: bitrateController\n\n            onDiscoverySettingsChanged: {\n                if (window.pollingActive) {\n                    ComputerManager.stopPollingAsync()\n                    ComputerManager.startPolling()\n                }\n            }\n        }\n'''
          text = text[:advanced_start] + advanced_instance + text[advanced_end:]

          # Re-find Basic after the Advanced replacement to avoid relying on stale offsets.
          basic_start, basic_end, _ = find_group(text, 'basicSettingsGroupBox')
          streaming_instance = '''        SettingsStreamingSection {\n            id: streamingSettingsSection\n            width: parent.width - (parent.leftPadding + parent.rightPadding)\n            bitrateState: bitrateController\n        }\n'''
          text = text[:basic_start] + streaming_instance + text[basic_end:]

          old_focus = 'resolutionComboBox.forceActiveFocus(Qt.TabFocus)'
          if text.count(old_focus) != 1:
              raise RuntimeError(f'Expected one parent resolution focus reference, found {text.count(old_focus)}')
          text = text.replace(old_focus, 'streamingSettingsSection.forceInitialFocus()', 1)

          old_language_handler = '''                window.clearOnBack = true\n                settingsPage.languageChanged()'''
          new_language_handler = '''                window.clearOnBack = true\n                streamingSettingsSection.languageChanged()\n                settingsPage.languageChanged()'''
          if text.count(old_language_handler) != 1:
              raise RuntimeError('Could not find parent language handler')
          text = text.replace(old_language_handler, new_language_handler, 1)

          if 'id: basicSettingsGroupBox' in text or 'id: advancedSettingsGroupBox' in text:
              raise RuntimeError('Legacy settings GroupBoxes remain in SettingsView')
          if 'resolutionComboBox.' in text:
              raise RuntimeError('Parent still references Streaming section internals')

          settings_path.write_text(text, encoding='utf-8')

          qrc = qrc_path.read_text(encoding='utf-8')
          anchor = '        <file>gui/SettingsBitrateController.qml</file>\n'
          additions = '        <file>gui/SettingsStreamingSection.qml</file>\n        <file>gui/SettingsAdvancedSection.qml</file>\n'
          if 'SettingsStreamingSection.qml' not in qrc:
              if qrc.count(anchor) != 1:
                  raise RuntimeError('Unexpected QML resource anchor count')
              qrc = qrc.replace(anchor, anchor + additions, 1)
          qrc_path.write_text(qrc, encoding='utf-8')

          print('Generated SettingsStreamingSection.qml and SettingsAdvancedSection.qml')
          print(f'SettingsView.qml is now {text.count(chr(10)) + 1} lines')

      - name: Validate extraction diff
        shell: bash
        run: |
          git diff --check
          git diff --stat -- app/gui/SettingsView.qml app/gui/SettingsStreamingSection.qml app/gui/SettingsAdvancedSection.qml app/qml.qrc
          git diff -- app/gui/SettingsView.qml app/qml.qrc

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gui/SettingsView.qml app/gui/SettingsStreamingSection.qml app/gui/SettingsAdvancedSection.qml app/qml.qrc
          git commit -m "extract remaining settings sections"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
