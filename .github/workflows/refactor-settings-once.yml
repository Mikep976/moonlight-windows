---
name: One-time settings section migration

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/refactor-settings-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'Mikep976/moonlight-windows' && github.event.pull_request.head.ref == 'agent/windows-modernization-foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace legacy settings groups
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/gui/SettingsView.qml')
          text = path.read_text(encoding='utf-8')

          def matching_brace(source, opening):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = opening

              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''

                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue

                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i

                  i += 1

              raise RuntimeError('Unmatched QML brace')

          def replace_group(source, object_id, replacement):
              marker = f'id: {object_id}'
              marker_pos = source.find(marker)
              if marker_pos < 0:
                  raise RuntimeError(f'Could not find {marker}')

              group_pos = source.rfind('GroupBox {', 0, marker_pos)
              if group_pos < 0:
                  raise RuntimeError(f'Could not find GroupBox for {object_id}')

              line_start = source.rfind('\n', 0, group_pos) + 1
              opening = source.find('{', group_pos)
              closing = matching_brace(source, opening)
              line_end = source.find('\n', closing)
              if line_end < 0:
                  line_end = closing + 1
              else:
                  line_end += 1

              return source[:line_start] + replacement + source[line_end:]

          replacements = [
              (
                  'audioSettingsGroupBox',
                  '''        SettingsAudioSection {\n            width: parent.width - (parent.leftPadding + parent.rightPadding)\n        }\n'''
              ),
              (
                  'hostSettingsGroupBox',
                  '''        SettingsHostSection {\n            width: parent.width - (parent.leftPadding + parent.rightPadding)\n        }\n'''
              ),
              (
                  'uiSettingsGroupBox',
                  '''        SettingsUiSection {\n            width: parent.width - (parent.leftPadding + parent.rightPadding)\n\n            onLanguageChanged: {\n                // Preserve the legacy retranslation workaround until AppView no longer needs it.\n                window.clearOnBack = true\n                settingsPage.languageChanged()\n            }\n        }\n'''
              ),
              (
                  'inputSettingsGroupBox',
                  '''        SettingsInputSection {\n            width: parent.width - (parent.leftPadding + parent.rightPadding)\n        }\n'''
              ),
              (
                  'gamepadSettingsGroupBox',
                  '''        SettingsGamepadSection {\n            width: parent.width - (parent.leftPadding + parent.rightPadding)\n        }\n'''
              ),
          ]

          original_lines = text.count('\n') + 1
          for object_id, replacement in replacements:
              text = replace_group(text, object_id, replacement)

          for object_id, _ in replacements:
              if f'id: {object_id}' in text:
                  raise RuntimeError(f'Legacy group {object_id} still present after migration')

          path.write_text(text, encoding='utf-8')
          print(f'SettingsView.qml: {original_lines} -> {text.count(chr(10)) + 1} lines')

      - name: Validate migration diff
        shell: bash
        run: |
          git diff --check
          git diff --stat -- app/gui/SettingsView.qml
          git diff -- app/gui/SettingsView.qml

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- app/gui/SettingsView.qml; then
            echo "No settings migration changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gui/SettingsView.qml
          git commit -m "wire extracted settings sections"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
